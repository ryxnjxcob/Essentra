<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Essentra Whiteboarding</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
                background-color: #f9fafb;
                background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
                background-size: 16px 16px;
            }
            .calligraphy {
                font-family: "Dancing Script", cursive;
            }
            .cartoon-btn {
                border: 2px solid #1f2937;
                box-shadow: 4px 4px 0px #1f2937;
                transition: all 0.2s cubic-bezier(0.87, -0.41, 0.19, 1.44);
            }
            .cartoon-btn:active {
                transform: translateY(4px) translateX(4px);
                box-shadow: 0px 0px 0px #1f2937;
            }
            #canvas {
                flex-grow: 1;
                position: relative;
                overflow: hidden;
            }
            .note {
                position: absolute;
                width: 160px;
                min-height: 100px;
                padding: 10px;
                border-radius: 8px;
                background: #fff59d;
                box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.15);
                cursor: move;
                resize: both;
                overflow: auto;
            }
            .note[contenteditable="true"]:focus {
                outline: 2px dashed #4f46e5;
            }
            /* AI Modal */
            #aiModal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 50;
            }
            #aiModalContent {
                background: white;
                padding: 1.5rem;
                border-radius: 0.5rem;
                width: 400px;
                max-width: 90%;
            }
        </style>
    </head>
    <body class="overflow-hidden">
        <div class="h-screen w-screen flex flex-col">
            <!-- Header -->
            <header
                class="flex justify-between items-center p-2 shadow-sm bg-white relative"
            >
                <div class="flex items-center gap-2">
                    <button class="p-1.5 rounded hover:bg-gray-100">
                        <span class="material-icons text-gray-600">menu</span>
                    </button>
                    <div class="flex items-center gap-2">
                        <h2 class="text-lg font-bold">Essentra</h2>
                    </div>
                </div>
                <div class="absolute left-1/2 -translate-x-1/2">
                    <button
                        class="flex items-center gap-2 px-3 py-1.5 rounded-md hover:bg-gray-100 border border-gray-300"
                    >
                        <span class="material-icons text-gray-600 text-base"
                            >edit_note</span
                        >
                        <span class="text-sm font-medium text-gray-700"
                            >Switch to Notepad</span
                        >
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button
                        class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center"
                    >
                        <span class="material-icons text-gray-600">person</span>
                    </button>
                </div>
            </header>

            <!-- Main Canvas -->
            <main id="canvas"></main>

            <!-- Floating minimal toolbar -->
            <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-20">
                <div
                    class="relative bg-white/95 border border-gray-200 shadow-xl rounded-2xl px-4 py-2 flex items-center gap-4"
                >
                    <!-- Left icons: Home, Boards -->
                    <button
                        type="button"
                        class="p-1.5 rounded-full hover:bg-gray-100 transition flex items-center justify-center"
                        title="Home"
                    >
                        <span class="material-icons text-gray-600 text-base"
                            >home</span
                        >
                    </button>

                    <button
                        type="button"
                        class="p-1.5 rounded-full hover:bg-gray-100 transition flex items-center justify-center"
                        title="Boards"
                    >
                        <span class="material-icons text-gray-600 text-base"
                            >folder_open</span
                        >
                    </button>

                    <!-- Divider -->
                    <div class="w-px h-5 bg-gray-200"></div>

                    <!-- Add text note -->
                    <button
                        id="addNoteBtn"
                        type="button"
                        class="p-1.5 rounded-full hover:bg-gray-100 transition flex items-center justify-center"
                        title="Add text note"
                    >
                        <span class="material-icons text-gray-700 text-base"
                            >note_add</span
                        >
                    </button>

                    <!-- Media trigger -->
                    <button
                        id="mediaBtn"
                        type="button"
                        class="p-1.5 rounded-full hover:bg-gray-100 transition flex items-center justify-center"
                        title="Add media"
                    >
                        <span class="material-icons text-gray-700 text-base"
                            >perm_media</span
                        >
                    </button>

                    <!-- Hidden file inputs -->
                    <input
                        id="imageInput"
                        type="file"
                        accept="image/*"
                        class="hidden"
                    />
                    <input
                        id="audioInput"
                        type="file"
                        accept="audio/*"
                        class="hidden"
                    />
                    <input
                        id="videoInput"
                        type="file"
                        accept="video/*"
                        class="hidden"
                    />

                    <!-- Media popover -->
                    <div
                        id="mediaPopover"
                        class="hidden absolute -top-3 left-1/2 -translate-x-1/2 -translate-y-full bg-white border border-gray-200 shadow-lg rounded-xl px-3 py-2 flex items-center gap-3"
                    >
                        <button
                            id="mediaImageBtn"
                            type="button"
                            class="flex items-center gap-1 text-xs font-medium text-gray-700 hover:bg-gray-100 rounded-full px-2 py-1 transition"
                        >
                            <span class="material-icons text-sm">image</span>
                            <span>Image</span>
                        </button>
                        <button
                            id="mediaAudioBtn"
                            type="button"
                            class="flex items-center gap-1 text-xs font-medium text-gray-700 hover:bg-gray-100 rounded-full px-2 py-1 transition"
                        >
                            <span class="material-icons text-sm"
                                >audiotrack</span
                            >
                            <span>Audio</span>
                        </button>
                        <button
                            id="mediaVideoBtn"
                            type="button"
                            class="flex items-center gap-1 text-xs font-medium text-gray-700 hover:bg-gray-100 rounded-full px-2 py-1 transition"
                        >
                            <span class="material-icons text-sm">movie</span>
                            <span>Video</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Zoom + Help -->
            <div
                class="fixed bottom-6 right-6 flex flex-col gap-3 items-center"
            >
                <div
                    class="bg-white shadow-md rounded-full flex items-center gap-1 p-2"
                >
                    <button
                        id="zoomOutBtn"
                        class="p-2 rounded-full hover:bg-gray-100"
                    >
                        <span class="material-icons text-gray-700">remove</span>
                    </button>
                    <span
                        id="zoomLevel"
                        class="text-sm font-medium text-gray-700"
                        >100%</span
                    >
                    <button
                        id="zoomInBtn"
                        class="p-2 rounded-full hover:bg-gray-100"
                    >
                        <span class="material-icons text-gray-700">add</span>
                    </button>
                </div>
                <button
                    id="helpBtn"
                    class="p-3 rounded-full bg-white shadow-md hover:bg-gray-100"
                >
                    <span class="material-icons text-gray-700"
                        >help_outline</span
                    >
                </button>
            </div>
        </div>

        <!-- Custom Context Menu -->
        <div
            id="contextMenu"
            class="hidden fixed bg-white border border-gray-300 rounded-md shadow-lg text-sm"
        >
            <ul>
                <li
                    id="summarizeOption"
                    class="px-4 py-2 hover:bg-gray-100 cursor-pointer"
                >
                    🧠 AI Summarize
                </li>
                <li
                    id="deleteOption"
                    class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-red-600"
                >
                    🗑️ Delete
                </li>
            </ul>
        </div>

        <!-- AI Modal -->
        <div
            id="aiModal"
            style="display: none"
            class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center"
        >
            <div
                id="aiModalContent"
                class="bg-white p-6 rounded-lg w-96 max-w-[90%]"
            >
                <h2 class="text-lg font-bold mb-2">AI Summary</h2>
                <textarea
                    id="aiText"
                    class="w-full h-48 p-2 border rounded"
                    readonly
                ></textarea>
                <button
                    id="closeAiModal"
                    class="mt-4 px-4 py-2 bg-blue-500 text-white rounded"
                >
                    Close
                </button>
            </div>
        </div>
        <script>
            const canvas = document.getElementById("canvas");
            const addNoteBtn = document.getElementById("addNoteBtn");
            const imageInput = document.getElementById("imageInput");
            const audioInput = document.getElementById("audioInput");
            const videoInput = document.getElementById("videoInput");

            const boardId = new URLSearchParams(window.location.search).get(
                "id",
            );
            // if you're now using cookies for auth, token may be null and that's fine
            const token = localStorage.getItem("access_token");

            let activeNote = null,
                offsetX = 0,
                offsetY = 0;
            let zoom = 1;

            // -------- API Helper (cookie + optional Authorization) --------
            async function apiFetch(url, options = {}) {
                const headers = {
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                };
                if (token) {
                    headers["Authorization"] = `Bearer ${token}`;
                }

                const res = await fetch(url, {
                    ...options,
                    headers,
                    credentials: "include", // important if you're using cookies
                });

                if (!res.ok) {
                    console.error("API error", res.status, await res.text());
                    return null;
                }
                return res.json().catch(() => null);
            }

            // Toolbar: add text note
            addNoteBtn.addEventListener("click", createNote);

            // Media popover toggle
            const mediaBtn = document.getElementById("mediaBtn");
            const mediaPopover = document.getElementById("mediaPopover");

            mediaBtn.addEventListener("click", (e) => {
                e.stopPropagation(); // don't trigger global click
                mediaPopover.classList.toggle("hidden");
            });

            // Close media popover when clicking outside
            document.addEventListener("click", (e) => {
                if (!mediaPopover.classList.contains("hidden")) {
                    // if click is not inside the popover or on the media button, close it
                    if (
                        !mediaPopover.contains(e.target) &&
                        e.target !== mediaBtn
                    ) {
                        mediaPopover.classList.add("hidden");
                    }
                }
            });

            // Media type buttons -> open corresponding hidden file input
            document
                .getElementById("mediaImageBtn")
                .addEventListener("click", () => {
                    document.getElementById("imageInput").click();
                    mediaPopover.classList.add("hidden");
                });

            document
                .getElementById("mediaAudioBtn")
                .addEventListener("click", () => {
                    document.getElementById("audioInput").click();
                    mediaPopover.classList.add("hidden");
                });

            document
                .getElementById("mediaVideoBtn")
                .addEventListener("click", () => {
                    document.getElementById("videoInput").click();
                    mediaPopover.classList.add("hidden");
                });

            // ---------------- CRUD for notes ----------------
            async function loadNotes() {
                const notes = await apiFetch(`/boards/${boardId}/notes`);
                if (notes) notes.forEach(renderNote);
            }

            async function createNote() {
                const newNote = await apiFetch(`/boards/${boardId}/notes`, {
                    method: "POST",
                    body: JSON.stringify({
                        text: "New Note",
                        x: 50,
                        y: 50,
                        width: 160,
                        height: 100,
                        note_type: "text",
                        extra_data: {},
                    }),
                });
                if (newNote) renderNote(newNote);
            }

            async function updateNotePosition(noteEl) {
                if (!document.body.contains(noteEl)) return;
                await apiFetch(
                    `/boards/${boardId}/notes/${noteEl.dataset.id}`,
                    {
                        method: "PUT",
                        body: JSON.stringify({
                            x: parseInt(noteEl.style.left),
                            y: parseInt(noteEl.style.top),
                            width: noteEl.offsetWidth,
                            height: noteEl.offsetHeight,
                        }),
                    },
                );
            }

            async function updateNoteText(noteEl) {
                if (!document.body.contains(noteEl)) return;
                await apiFetch(
                    `/boards/${boardId}/notes/${noteEl.dataset.id}`,
                    {
                        method: "PUT",
                        body: JSON.stringify({ text: noteEl.textContent }),
                    },
                );
            }

            async function saveNoteSize(noteEl) {
                if (!document.body.contains(noteEl)) return;
                await apiFetch(
                    `/boards/${boardId}/notes/${noteEl.dataset.id}`,
                    {
                        method: "PUT",
                        body: JSON.stringify({
                            width: noteEl.offsetWidth,
                            height: noteEl.offsetHeight,
                        }),
                    },
                );
            }

            function deleteNote(noteEl) {
                const id = noteEl.dataset.id;
                noteEl.remove();
                fetch(`/boards/${boardId}/notes/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json",
                        ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    },
                    credentials: "include",
                })
                    .then((res) =>
                        res.ok
                            ? console.log(`Note ${id} deleted`)
                            : Promise.reject(res),
                    )
                    .catch((err) => console.error(err));
            }

            // --------- Media upload + note creation ----------
            async function uploadFileAndCreateNote(file, type) {
                if (!file) return;

                const formData = new FormData();
                formData.append("file", file);
                formData.append("board_id", boardId);

                try {
                    // 1) upload media
                    const uploadRes = await fetch(`/notes/upload`, {
                        method: "POST",
                        body: formData,
                        credentials: "include",
                        headers: token
                            ? { Authorization: `Bearer ${token}` }
                            : {},
                    });

                    if (!uploadRes.ok) {
                        console.error("Upload failed", await uploadRes.text());
                        alert("Failed to upload media");
                        return;
                    }

                    const { url } = await uploadRes.json();

                    // 2) create note with note_type + extra_data.url
                    const newNote = await apiFetch(`/boards/${boardId}/notes`, {
                        method: "POST",
                        body: JSON.stringify({
                            text: "",
                            x: 80,
                            y: 80,
                            width: type === "image" ? 220 : 260,
                            height: type === "image" ? 220 : 120,
                            note_type: type,
                            extra_data: { url },
                        }),
                    });

                    if (newNote) renderNote(newNote);
                } catch (err) {
                    console.error(err);
                    alert("Error uploading media");
                }
            }

            imageInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                uploadFileAndCreateNote(file, "image");
                e.target.value = "";
            });

            audioInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                uploadFileAndCreateNote(file, "audio");
                e.target.value = "";
            });

            videoInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                uploadFileAndCreateNote(file, "video");
                e.target.value = "";
            });
            // ---------------- Context Menu (AI + Delete) ----------------
            function attachContextMenu(noteEl) {
                noteEl.addEventListener("contextmenu", async (e) => {
                    e.preventDefault();
                    const menu = document.getElementById("contextMenu");
                    menu.style.top = e.clientY + "px";
                    menu.style.left = e.clientX + "px";
                    menu.classList.remove("hidden");

                    const deleteOption = menu.querySelector("#deleteOption");
                    const summarizeOption =
                        menu.querySelector("#summarizeOption");

                    // reset listeners
                    deleteOption.replaceWith(deleteOption.cloneNode(true));
                    summarizeOption.replaceWith(
                        summarizeOption.cloneNode(true),
                    );

                    menu.querySelector("#deleteOption").addEventListener(
                        "click",
                        () => {
                            deleteNote(noteEl);
                            menu.classList.add("hidden");
                        },
                    );

                    menu.querySelector("#summarizeOption").addEventListener(
                        "click",
                        async () => {
                            menu.classList.add("hidden");
                            try {
                                const res = await fetch("/summarize", {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json",
                                        ...(token
                                            ? {
                                                  Authorization: `Bearer ${token}`,
                                              }
                                            : {}),
                                    },
                                    credentials: "include",
                                    body: JSON.stringify({
                                        text: noteEl.textContent, // for media notes this will usually be empty
                                    }),
                                });
                                if (!res.ok)
                                    throw new Error("Failed to summarize");
                                const data = await res.json();
                                document.getElementById("aiText").value =
                                    data.summary;
                                document.getElementById(
                                    "aiModal",
                                ).style.display = "flex";
                            } catch (err) {
                                console.error(err);
                                alert("Error generating summary");
                            }
                        },
                    );
                });
            }

            // Modal close
            document
                .getElementById("closeAiModal")
                .addEventListener("click", () => {
                    document.getElementById("aiModal").style.display = "none";
                });

            // Hide context menu on click outside
            document.addEventListener("click", () =>
                document.getElementById("contextMenu").classList.add("hidden"),
            );

            // ---------------- Render note (text + media types) ----------------
            function renderNote(note) {
                const noteEl = document.createElement("div");
                noteEl.className = "note";
                noteEl.style.left = note.x + "px";
                noteEl.style.top = note.y + "px";
                if (note.width) noteEl.style.width = note.width + "px";
                if (note.height) noteEl.style.height = note.height + "px";
                noteEl.dataset.id = note.id;

                const type = note.note_type || "text";
                const extra = note.extra_data || {};

                // clear & render content
                noteEl.innerHTML = "";

                if (type === "image" && extra.url) {
                    const img = document.createElement("img");
                    img.src = extra.url;
                    img.alt = note.text || "Image note";
                    img.className =
                        "w-full h-full object-contain rounded pointer-events-none";
                    noteEl.appendChild(img);
                    noteEl.setAttribute("contenteditable", "false");
                } else if (type === "audio" && extra.url) {
                    const audio = document.createElement("audio");
                    audio.controls = true;
                    audio.src = extra.url;
                    audio.className = "w-full";
                    noteEl.appendChild(audio);
                    noteEl.setAttribute("contenteditable", "false");
                } else if (type === "video" && extra.url) {
                    const video = document.createElement("video");
                    video.controls = true;
                    video.src = extra.url;
                    video.className = "w-full h-full";
                    noteEl.appendChild(video);
                    noteEl.setAttribute("contenteditable", "false");
                } else {
                    // default: text note
                    noteEl.textContent = note.text || "New Note";
                    noteEl.contentEditable = true;
                    noteEl.onblur = () => updateNoteText(noteEl);
                }

                // only start drag when not interacting with media/inputs
                noteEl.addEventListener("mousedown", (e) => {
                    const tag = e.target.tagName.toLowerCase();
                    if (
                        [
                            "audio",
                            "video",
                            "img",
                            "button",
                            "input",
                            "textarea",
                        ].includes(tag)
                    ) {
                        return;
                    }
                    startDrag(e, noteEl);
                });

                attachContextMenu(noteEl);
                canvas.appendChild(noteEl);
            }

            // ---------------- Drag & Resize ----------------
            function startDrag(e, noteEl) {
                const rect = noteEl.getBoundingClientRect();
                const isResizing =
                    e.clientX - rect.left > rect.width - 16 ||
                    e.clientY - rect.top > rect.height - 16;

                if (isResizing) {
                    noteEl.addEventListener(
                        "mouseup",
                        () => saveNoteSize(noteEl),
                        { once: true },
                    );
                    return;
                }

                activeNote = noteEl;
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                document.addEventListener("mousemove", dragNote);
                document.addEventListener("mouseup", stopDrag);
            }

            function dragNote(e) {
                if (!activeNote) return;
                activeNote.style.left = e.clientX - offsetX + "px";
                activeNote.style.top = e.clientY - offsetY + "px";
            }

            function stopDrag() {
                if (activeNote) updateNotePosition(activeNote);
                document.removeEventListener("mousemove", dragNote);
                document.removeEventListener("mouseup", stopDrag);
                activeNote = null;
            }

            // ---------------- Zoom & Help ----------------
            document
                .getElementById("zoomInBtn")
                .addEventListener("click", () => {
                    zoom += 0.1;
                    canvas.style.transform = `scale(${zoom})`;
                    document.getElementById("zoomLevel").textContent =
                        Math.round(zoom * 100) + "%";
                });

            document
                .getElementById("zoomOutBtn")
                .addEventListener("click", () => {
                    zoom = Math.max(0.2, zoom - 0.1);
                    canvas.style.transform = `scale(${zoom})`;
                    document.getElementById("zoomLevel").textContent =
                        Math.round(zoom * 100) + "%";
                });

            document.getElementById("helpBtn").addEventListener("click", () => {
                alert(
                    "👉 Right-click a note to delete or summarize\n" +
                        "✏️ Click text to edit\n" +
                        "🖼 Upload images/audio/video from the bottom bar\n" +
                        "📦 Drag to move\n↔ Resize with corner handle",
                );
            });

            loadNotes();
        </script>
    </body>
</html>
