<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
        }
        .logo-font {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
<div class="flex h-screen">
<div class="w-1/2 hidden lg:flex flex-col justify-between p-12 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD6zLQS0zqDSxx7YOSDFyjmCV5gfxpHk4A1egGg9EdgDOfjLQG7GzKVWKYMYOTvLjVjwLrICxeJ4TFwdMowTw3imdLAWbyIZEt-K_lFeqnGC6TMVS9Ku7hLMUktyqgzcmLfFyA3EB_gOw3PWNFQg69iFEdxxxKTwBUMOVWFxl3JtgUY_TdEjnKbBolpzXMJkYvlsZDvYPJ-zD4I1BDCp0KeeZwQneS4D0ccYZ5nd-MzllKZ9sp0Oav6HtzYF-akGqDBMcOvoFm59hg');">
<div>
<span class="text-white text-4xl font-bold logo-font">Essentra</span>
</div>
<div class="text-white">
<h1 class="text-5xl font-bold leading-tight">Create Your<br/>New Password</h1>
<div class="flex mt-4 space-x-2">
<span class="w-2 h-1 bg-gray-400 rounded-full"></span>
<span class="w-2 h-1 bg-gray-400 rounded-full"></span>
<span class="w-10 h-1 bg-white rounded-full"></span>
</div>
</div>
</div>
<div class="w-full lg:w-1/2 flex items-center justify-center p-8">
<div class="w-full max-w-md">
<h2 class="text-4xl font-bold mb-4">Reset Password</h2>
<p class="text-gray-400 mb-8">
                Please create a new password that you will remember.
            </p>
<form>
<div class="mb-6">
<input class="w-full bg-gray-800 border border-gray-700 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter new password" type="password"/>
</div>
<div class="mb-6">
<input class="w-full bg-gray-800 border border-gray-700 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Confirm new password" type="password"/>
</div>
<button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-4 rounded-lg transition duration-300" type="submit">Reset Password</button>
</form>
</div>
</div>
</div>
<script>
    document.getElementById('resetForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const token = document.getElementById('token').value;
        const newPassword = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/password-reset/confirm', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    token: token,
                    new_password: newPassword
                })
            });

            const result = await response.json();
            document.getElementById('responseMessage').textContent = result.message || result.detail;

        } catch (error) {
            document.getElementById('responseMessage').textContent = 'An error occurred. Please try again.';
        }
    });
</script>
</body></html>
