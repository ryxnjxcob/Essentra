<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create an Account</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <style type="text/tailwindcss">
    body {
      font-family: 'Inter', sans-serif;
    }
    .logo-font {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white">
  <div class="flex h-screen">
    <!-- Left section with background -->
    <div class="w-1/2 hidden lg:flex flex-col justify-between p-12 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD6zLQS0zqDSxx7YOSDFyjmCV5gfxpHk4A1egGg9EdgDOfjLQG7GzKVWKYMYOTvLjVjwLrICxeJ4TFwdMowTw3imdLAWbyIZEt-K_lFeqnGC6TMVS9Ku7hLMUktyqgzcmLfFyA3EB_gOw3PWNFQg69iFEdxxxKTwBUMOVWFxl3JtgUY_TdEjnKbBolpzXMJkYvlsZDvYPJ-zD4I1BDCp0KeeZwQneS4D0ccYZ5nd-MzllKZ9sp0Oav6HtzYF-akGqDBMcOvoFm59hg');">
      <div>
        <span class="text-white text-4xl font-bold logo-font">Essentra</span>
      </div>
      <div class="text-white">
        <h1 class="text-5xl font-bold leading-tight">Capturing Moments,<br/>Creating Memories</h1>
        <div class="flex mt-4 space-x-2">
          <span class="w-10 h-1 bg-white rounded-full"></span>
          <span class="w-2 h-1 bg-gray-400 rounded-full"></span>
          <span class="w-2 h-1 bg-gray-400 rounded-full"></span>
        </div>
      </div>
    </div>

    <!-- Right section with form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
      <div class="w-full max-w-md">
        <h2 class="text-4xl font-bold mb-4">Create an account</h2>
        <p class="text-gray-400 mb-8">
          Already have an account? 
          <a class="text-purple-400 font-medium" href="login.html">Log in</a> 
        </p>

        <form id="registerForm">
          <div class="flex space-x-4 mb-4">
            <div class="w-1/2">
              <input id="firstName" class="w-full bg-gray-800 border border-gray-700 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="First name" type="text" required/>
            </div>
            <div class="w-1/2">
              <input id="lastName" class="w-full bg-gray-800 border border-gray-700 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Last name" type="text" required/>
            </div>
          </div>

          <div class="mb-4">
            <input id="email" class="w-full bg-gray-800 border border-gray-700 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Email" type="email" required/>
          </div>

          <div class="mb-4 relative">
            <input id="password" class="w-full bg-gray-800 border border-gray-700 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter your password" type="password" required/>
            <button class="absolute inset-y-0 right-0 px-4 flex items-center text-gray-400" type="button">
              <span class="material-icons">visibility</span>
            </button>
          </div>

          <div class="flex items-center mb-6">
            <input id="terms" checked class="form-checkbox h-5 w-5 bg-gray-800 border-gray-600 text-purple-600 rounded focus:ring-purple-500" type="checkbox" required/>
            <label class="ml-2 text-sm text-gray-400" for="terms">
              I agree to the <a class="text-purple-400 font-medium" href="#">Terms &amp; Conditions</a>
            </label>
          </div>

          <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-4 rounded-lg transition duration-300" type="submit">
            Create account
          </button>
        </form>

        <div id="message" class="mt-4 text-sm"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const first_name = document.getElementById("firstName").value.trim();
      const last_name = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const messageDiv = document.getElementById("message");
      messageDiv.textContent = "Creating account...";
      messageDiv.className = "mt-4 text-sm text-gray-400";

      try {
        const response = await fetch("http://127.0.0.1:8000/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ first_name, last_name, email, password })
        });

        if (response.ok) {
          messageDiv.textContent = "Account created successfully! Redirecting...";
          messageDiv.className = "mt-4 text-sm text-green-400";
          document.getElementById("registerForm").reset();
          setTimeout(() => {
            window.location.href = "login.html";  // <-- Redirect to login
          }, 1500); // small delay to show success message
        } else {
          const errorData = await response.json();
          messageDiv.textContent = errorData.detail || "Registration failed.";
          messageDiv.className = "mt-4 text-sm text-red-400";
        }
      } catch (err) {
        console.error("Error connecting to server:", err);
        messageDiv.textContent = "Cannot connect to the server.";
        messageDiv.className = "mt-4 text-sm text-red-400";
      }
    });
  </script>
</body>
</html>
